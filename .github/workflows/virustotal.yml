name: VirusTotal release scan

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        type: string
        description: Release tag to scan, or latest
        default: latest
        required: true

permissions:
  contents: write

concurrency:
  group: virustotal-${{ github.event.release.id || inputs.tag || 'latest' }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download and verify the release ZIP
        id: release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_TAG: ${{ inputs.tag || 'latest' }}
        with:
          script: |
            const fs = require('node:fs/promises');
            const path = require('node:path');
            const crypto = require('node:crypto');
            let release = context.payload.release;
            if (!release) {
              release = process.env.RELEASE_TAG === 'latest'
                ? (await github.rest.repos.getLatestRelease(context.repo)).data
                : (await github.rest.repos.getReleaseByTag({...context.repo, tag: process.env.RELEASE_TAG})).data;
            }
            const assets = release.assets.filter(asset => /^Explorer-.*\.zip$/.test(asset.name));
            if (assets.length !== 1) throw new Error('Expected exactly one Explorer release ZIP');
            const asset = assets[0];
            const response = await fetch(asset.browser_download_url);
            if (!response.ok) throw new Error(`Release download failed: HTTP ${response.status}`);
            const bytes = Buffer.from(await response.arrayBuffer());
            const hash = crypto.createHash('sha256').update(bytes).digest('hex');
            if (asset.digest !== `sha256:${hash}` || asset.size !== bytes.length) throw new Error('Release ZIP checksum mismatch');
            const directory = path.join(process.env.RUNNER_TEMP, 'virustotal');
            await fs.mkdir(directory, {recursive: true});
            const file = path.join(directory, path.basename(asset.name));
            await fs.writeFile(file, bytes);
            core.setOutput('file', file);
            core.setOutput('id', String(release.id));
            core.setOutput('sha256', hash);

      - name: Submit the published ZIP to VirusTotal
        id: scan
        uses: cssnr/virustotal-action@e2d194486614b28c3cf884f4bf13e39cac959b8d # v1
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          file_globs: ${{ steps.release.outputs.file }}
          release_id: ${{ steps.release.outputs.id }}
          sha256: 'true'
          update_release: 'true'
          release_heading: '### VirusTotal scan'
          rate_limit: '4'

      - name: Wait for completed analysis and update the latest-release badge
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          VT_RESULTS: ${{ steps.scan.outputs.json }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
          RELEASE_SHA256: ${{ steps.release.outputs.sha256 }}
        with:
          script: |
            const results = JSON.parse(process.env.VT_RESULTS);
            if (results.length !== 1 || !results[0].id) throw new Error('Missing VirusTotal analysis ID');
            const pause = ms => new Promise(resolve => setTimeout(resolve, ms));
            let completed = false;
            let stats;
            for (let attempt = 0; attempt < 80; attempt++) {
              await pause(16000);
              const response = await fetch(`https://www.virustotal.com/api/v3/analyses/${encodeURIComponent(results[0].id)}`, {
                headers: {'x-apikey': process.env.VT_API_KEY}
              });
              if (response.status === 429) { await pause(60000); continue; }
              if (!response.ok) throw new Error(`VirusTotal analysis lookup failed: HTTP ${response.status}`);
              const data = await response.json();
              if (data.data.attributes.status === 'completed') {
                stats = data.data.attributes.stats;
                completed = true; break;
              }
            }
            if (!completed) throw new Error('VirusTotal analysis is still pending; README badge was not changed');
            const latest = (await github.rest.repos.getLatestRelease(context.repo)).data;
            if (String(latest.id) !== process.env.RELEASE_ID) {
              core.info('Older release scanned; leaving the latest-release README badge unchanged');
              return;
            }
            const readme = (await github.rest.repos.getContent({...context.repo, path: 'README.md', ref: 'main'})).data;
            const original = Buffer.from(readme.content, 'base64').toString('utf8');
            const start = '<!-- VIRUSTOTAL_BADGE_START -->';
            const end = '<!-- VIRUSTOTAL_BADGE_END -->';
            const first = original.indexOf(start), last = original.indexOf(end);
            if (first < 0 || last < first) throw new Error('README badge markers are missing');
            const hash = process.env.RELEASE_SHA256;
            const detections = (stats.malicious || 0) + (stats.suspicious || 0);
            const engines = detections + (stats.harmless || 0) + (stats.undetected || 0);
            if (!engines) throw new Error('Completed analysis has no engine results');
            const color = detections ? 'red' : 'brightgreen';
            const badge = `[![VirusTotal release scan: ${detections} detections / ${engines} engines](https://img.shields.io/badge/VirusTotal-${detections}%20%2F%20${engines}-${color})](https://www.virustotal.com/gui/file/${hash})`;
            const updated = original.slice(0, first + start.length) + '\n' + badge + '\n' + original.slice(last);
            if (updated !== original) await github.rest.repos.createOrUpdateFileContents({
              ...context.repo, path: 'README.md', branch: 'main', sha: readme.sha,
              message: `Update VirusTotal badge for ${latest.tag_name}`, content: Buffer.from(updated).toString('base64')
            });
            await core.summary.addLink('Completed VirusTotal report', `https://www.virustotal.com/gui/file/${hash}`).write();
